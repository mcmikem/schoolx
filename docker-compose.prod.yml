# ============================================
# SkoolMate OS - Production Docker Compose
# Self-hosted deployment (Lifetime plan)
# Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - CRON_SECRET=${CRON_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - AFRICAS_TALKING_API_KEY=${AFRICAS_TALKING_API_KEY}
      - AFRICAS_TALKING_USERNAME=${AFRICAS_TALKING_USERNAME}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    restart: unless-stopped
    mem_limit: 1g
    cpus: "2"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - skoolmate_network

  # Cron runner for scheduled tasks
  cron:
    image: alpine/curl:latest
    environment:
      - CRON_SECRET=${CRON_SECRET}
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    command: sh -c "
      while true; do
        curl -s -H 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/sms-reminders/ &
        curl -s -H 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/expire-entitlements/ &
        sleep 3600
      done
    "
    depends_on:
      app:
        condition: service_healthy
    networks:
      - skoolmate_network

  # Daily cron for size band recalculation
  cron-daily:
    image: alpine/curl:latest
    environment:
      - CRON_SECRET=${CRON_SECRET}
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    command: sh -c "
      while true; do
        curl -s -H 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/recalculate-size-bands/
        sleep 86400
      done
    "
    depends_on:
      app:
        condition: service_healthy
    networks:
      - skoolmate_network

networks:
  skoolmate_network:
    driver: bridge
