<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#001F3F">
<title>SkoolMate Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #001F3F; color: #fff;
    display: flex; flex-direction: column;
  }
  .screen { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* Login */
  #loginScreen { justify-content: center; align-items: center; padding: 24px; }
  #loginScreen .card { width: 100%; max-width: 360px; }
  h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
  .sub { text-align: center; opacity: .7; margin-bottom: 16px; font-size: 14px; }
  input {
    width: 100%; padding: 14px; margin: 6px 0; border: 1px solid #ccc;
    border-radius: 10px; font-size: 16px; color: #000;
  }
  .btn {
    width: 100%; padding: 14px; margin: 8px 0; border: 0; border-radius: 10px;
    background: #16a34a; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn.secondary { background: #3b82f6; }
  .btn.danger { background: #dc2626; }
  .btn.warn { background: #f59e0b; color: #000; }
  .btn.ghost { background: rgba(255,255,255,0.15); }
  .btn:active { opacity: 0.7; }
  .msg { margin-top: 10px; padding: 10px; border-radius: 8px; text-align: center; min-height: 40px; font-size: 14px; }
  .msg.ok { background: #16a34a; }
  .msg.err { background: #dc2626; }

  /* Scan screen */
  #scanScreen { position: relative; }
  .cam-wrap { flex: 1; position: relative; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  canvas { display: none; }

  /* Floating controls */
  .float-top {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; gap: 8px; z-index: 10;
  }
  .float-top select {
    flex: 1; padding: 8px; border-radius: 8px; font-size: 14px; border: 0;
    background: rgba(0,0,0,0.6); color: #fff;
  }
  .float-bottom {
    position: absolute; bottom: 12px; left: 12px; right: 12px;
    display: flex; gap: 8px; z-index: 10;
  }
  .float-bottom button { flex: 1; padding: 10px; font-size: 13px; margin: 0; }
  .float-side {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 8px; z-index: 10;
  }
  .float-side button { width: 48px; height: 48px; padding: 0; font-size: 20px; border-radius: 50%; }

  /* Mode bar */
  .modebar { display: flex; gap: 4px; padding: 8px 12px; background: rgba(0,0,0,0.5); }
  .modebar button { flex: 1; padding: 8px; font-size: 12px; margin: 0; border-radius: 6px; }
  .modebar button.active { background: #16a34a; }
  .modebar button:not(.active) { background: rgba(255,255,255,0.15); }

  /* Result overlay */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85); opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay.ok { background: rgba(22,163,74,0.92); }
  .overlay.err { background: rgba(220,38,38,0.92); }
  .overlay .icon { font-size: 120px; line-height: 1; margin-bottom: 12px; }
  .overlay .name { font-size: 26px; font-weight: 700; text-align: center; padding: 0 16px; }
  .overlay .sub { font-size: 16px; opacity: 0.9; margin-top: 6px; }

  .count-badge {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 20px;
    font-size: 14px; font-weight: 700; z-index: 10;
  }
  .small { font-size: 11px; opacity: 0.6; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<!-- Login -->
<div class="screen" id="loginScreen">
  <div class="card">
    <h1>SkoolMate Scanner</h1>
    <p class="sub">Staff sign in</p>
    <input id="phone" type="tel" placeholder="Phone number" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="btn full">Sign In</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- Scan -->
<div class="screen hidden" id="scanScreen">
  <div class="modebar">
    <button id="modeMeal" class="active">Meals</button>
    <button id="modeAttend">Attendance</button>
    <button id="modeStaff">Staff</button>
  </div>
  <div class="cam-wrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
    <div class="count-badge" id="countBadge">0 scanned</div>
    <div class="float-top" id="mealOpts">
      <select id="mealType">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="supper">Supper</option>
      </select>
    </div>
    <div class="float-top hidden" id="staffOpts">
      <select id="staffAction">
        <option value="check_in">Check In</option>
        <option value="check_out">Check Out</option>
      </select>
    </div>
    <div class="float-side">
      <button id="camBtn" class="btn ghost" title="Switch camera">&#x1F504;</button>
    </div>
    <div class="float-bottom">
      <button id="stopBtn" class="btn danger">Stop</button>
      <button id="toggleDupes" class="btn secondary">Dupes: ON</button>
      <button id="clearScanned" class="btn warn">Clear</button>
      <button id="logoutBtn" class="btn ghost">Out</button>
    </div>
    <!-- Result overlay -->
    <div class="overlay" id="overlay">
      <div class="icon" id="overlayIcon">&#x2713;</div>
      <div class="name" id="overlayName"></div>
      <div class="sub" id="overlaySub"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  "use strict";
  var token = null;
  var scanning = false;
  var stream = null;
  var rafId = null;
  var lastScan = 0;
  var lastScanValue = "";
  var SCAN_COOLDOWN = 800;
  var scanCount = 0;
  var useFront = false;
  var mode = "meal";
  var scannedSet = {};
  var blockDupes = true;
  var overlayTimer = null;

  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove("hidden"); }
  function hide(id) { $(id).classList.add("hidden"); }

  // ---- Sound ----
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      setTimeout(function () { osc.stop(); }, dur);
    } catch (e) {}
  }
  function soundOk() { beep(880, 100, "sine"); setTimeout(function(){ beep(1320, 100, "sine"); }, 120); }
  function soundErr() { beep(220, 300, "square"); }

  // ---- Overlay flash ----
  function flashOverlay(ok, name, sub) {
    var ov = $("overlay");
    ov.className = "overlay show " + (ok ? "ok" : "err");
    $("overlayIcon").textContent = ok ? "\u2713" : "\u2717";
    $("overlayName").textContent = name || "";
    $("overlaySub").textContent = sub || "";
    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(function () { ov.className = "overlay"; }, 1400);
  }

  // ---- Auth ----
  function loadToken() {
    try { token = localStorage.getItem("sm_token"); } catch (e) { token = null; }
  }
  function saveToken(t) { try { localStorage.setItem("sm_token", t); } catch (e) {} }
  function clearToken() { try { localStorage.removeItem("sm_token"); } catch (e) {} }

  function login() {
    var phone = $("phone").value.trim();
    var pass = $("pass").value.trim();
    if (!phone || !pass) { showMsg("loginMsg", "Enter phone and password", false); return; }
    $("loginBtn").disabled = true;
    $("loginBtn").textContent = "Signing in...";
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/auth/signin/", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      $("loginBtn").disabled = false;
      $("loginBtn").textContent = "Sign In";
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200 && data && data.success && data.data && data.data.access_token) {
        saveToken(data.data.access_token);
        token = data.data.access_token;
        startScanner();
      } else {
        showMsg("loginMsg", (data && data.error) || "Login failed", false);
        soundErr();
      }
    };
    xhr.send(JSON.stringify({ identifier: phone, password: pass }));
  }
  function showMsg(id, text, ok) {
    var el = $(id);
    el.textContent = text;
    el.className = "msg " + (ok === true ? "ok" : ok === false ? "err" : "");
  }

  // ---- Offline queue ----
  function queueScan(scan) {
    try {
      var q = JSON.parse(localStorage.getItem("sm_queue") || "[]");
      q.push(scan);
      localStorage.setItem("sm_queue", JSON.stringify(q));
    } catch (e) {}
    updateQueueInfo();
  }
  function updateQueueInfo() {
    try {
      var q = JSON.parse(localStorage.getItem("sm_queue") || "[]");
      var badge = $("countBadge");
      var txt = scanCount + " scanned";
      if (q.length) txt += " | " + q.length + " queued";
      badge.textContent = txt;
    } catch (e) {}
  }
  function syncQueue() {
    try {
      var q = JSON.parse(localStorage.getItem("sm_queue") || "[]");
      if (!q.length) return;
      var remaining = [];
      for (var i = 0; i < q.length; i++) {
        (function (scan, idx) {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", scan.url, true);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.setRequestHeader("Authorization", "Bearer " + token);
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (!(xhr.status >= 200 && xhr.status < 300)) remaining.push(scan);
            if (idx === q.length - 1) {
              try { localStorage.setItem("sm_queue", JSON.stringify(remaining)); } catch (e) {}
              updateQueueInfo();
            }
          };
          xhr.send(JSON.stringify(scan.body));
        })(q[i], i);
      }
    } catch (e) {}
  }

  // ---- Camera ----
  function getUserMediaCompat(constraints, onSuccess, onError) {
    if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === "function") {
      navigator.mediaDevices.getUserMedia(constraints).then(onSuccess).catch(onError);
      return;
    }
    var legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
    if (typeof legacy === "function") {
      legacy.call(navigator, constraints, onSuccess, onError);
      return;
    }
    onError(new Error("Camera not supported on this browser"));
  }

  function startCamera() {
    stopCamera();
    var facing = useFront ? "user" : "environment";
    getUserMediaCompat({ video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } } }, function (s) {
      stream = s;
      var v = $("video");
      try { v.srcObject = s; } catch (e) { v.src = (window.URL || window.webkitURL).createObjectURL(s); }
      v.setAttribute("playsinline", "true");
      v.setAttribute("webkit-playsinline", "true");
      v.muted = true;
      var pp = v.play();
      if (pp && typeof pp.then === "function") { pp.catch(function () {}); }
      scanning = true;
      tick();
    }, function (err) {
      flashOverlay(false, "Camera Error", err && err.message ? err.message : String(err));
      soundErr();
    });
  }
  function stopCamera() {
    scanning = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }

  function tick() {
    if (!scanning) return;
    var video = $("video");
    var canvas = $("canvas");
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      if (typeof jsQR !== "undefined") {
        var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
        if (code && code.data && code.data !== lastScanValue) {
          var now = Date.now();
          if (now - lastScan > SCAN_COOLDOWN) {
            lastScan = now;
            lastScanValue = code.data;
            handleScan(code.data);
            setTimeout(function () { lastScanValue = ""; }, SCAN_COOLDOWN + 300);
          }
        }
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  // ---- Mode handling ----
  function setMode(m) {
    mode = m;
    var btns = ["modeMeal", "modeAttend", "modeStaff"];
    for (var i = 0; i < btns.length; i++) {
      $(btns[i]).classList.remove("active");
    }
    $("mealOpts").classList.add("hidden");
    $("staffOpts").classList.add("hidden");
    if (m === "meal") { $("modeMeal").classList.add("active"); $("modeTitle").textContent = "Meal Scanner"; $("mealOpts").classList.remove("hidden"); }
    else if (m === "attend") { $("modeAttend").classList.add("active"); $("modeTitle").textContent = "Attendance Scanner"; }
    else { $("modeStaff").classList.add("active"); $("modeTitle").textContent = "Staff Attendance"; $("staffOpts").classList.remove("hidden"); }
  }

  function handleScan(scanValue) {
    if (blockDupes && scannedSet[scanValue]) {
      flashOverlay(false, "Already Scanned", "This card was already scanned this session");
      soundErr();
      return;
    }
    var url, body;
    if (mode === "meal") {
      url = "/api/meals/scan/";
      body = { scanValue: scanValue, mealType: $("mealType").value, token: token };
    } else if (mode === "attend") {
      url = "/api/attendance/scan/";
      body = { scanValue: scanValue, token: token };
    } else {
      url = "/api/staff/scan-attendance/";
      body = { scanValue: scanValue, action: $("staffAction").value, token: token };
    }
    flashOverlay(null, "Processing...", "");
    var xhr = new XMLHttpRequest();
    xhr.open("POST", url, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300 && data && data.success) {
        var student = (data.data && (data.data.student || data.data.staff)) || null;
        var name = student ? (student.first_name || student.full_name || "") + " " + (student.last_name || "") : "OK";
        var code = (data.data && data.data.reasonCode) || "OK";
        scannedSet[scanValue] = true;
        scanCount++;
        $("countBadge").textContent = scanCount + " scanned";
        flashOverlay(true, name.trim(), code);
        soundOk();
      } else if (xhr.status === 0) {
        queueScan({ url: url, body: body, at: Date.now() });
        flashOverlay(false, "Offline", "Queued - will sync when online");
        soundErr();
      } else if (xhr.status >= 500) {
        queueScan({ url: url, body: body, at: Date.now() });
        flashOverlay(false, "Server Error", "Queued - will retry");
        soundErr();
      } else if (xhr.status === 401) {
        clearToken();
        token = null;
        stopCamera();
        hide("scanScreen");
        show("loginScreen");
        showMsg("loginMsg", "Session expired. Please sign in again.", false);
        soundErr();
      } else {
        var err = (data && (data.error || (data.data && data.data.reasonCode))) || xhr.responseText || ("Error " + xhr.status);
        flashOverlay(false, "Denied", err);
        soundErr();
      }
    };
    xhr.send(JSON.stringify(body));
  }

  function startScanner() {
    hide("loginScreen");
    show("scanScreen");
    scanCount = 0;
    $("countBadge").textContent = "0 scanned";
    updateQueueInfo();
    startCamera();
    syncQueue();
  }

  // ---- Events ----
  $("loginBtn").addEventListener("click", login);
  $("stopBtn").addEventListener("click", stopCamera);
  $("camBtn").addEventListener("click", function () { useFront = !useFront; startCamera(); });
  $("modeMeal").addEventListener("click", function () { setMode("meal"); });
  $("modeAttend").addEventListener("click", function () { setMode("attend"); });
  $("modeStaff").addEventListener("click", function () { setMode("staff"); });
  $("toggleDupes").addEventListener("click", function () {
    blockDupes = !blockDupes;
    $("toggleDupes").textContent = "Dupes: " + (blockDupes ? "ON" : "OFF");
  });
  $("clearScanned").addEventListener("click", function () {
    scannedSet = {};
    scanCount = 0;
    $("countBadge").textContent = "0 scanned";
    flashOverlay(null, "Cleared", "Scanned list reset");
  });
  $("logoutBtn").addEventListener("click", function () {
    stopCamera();
    clearToken();
    token = null;
    hide("scanScreen");
    show("loginScreen");
    showMsg("loginMsg", "", null);
  });

  // ---- Init ----
  loadToken();
  if (token) {
    startScanner();
  } else {
    show("loginScreen");
  }
  updateQueueInfo();
  window.addEventListener("online", syncQueue);
})();
</script>
</body>
</html>
